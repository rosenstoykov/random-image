<!doctype html>

<title>Коледно късметче</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center;
    color: #fff7e8; background: radial-gradient(ellipse at 50% 24%, #173f65, #081a35 60%, #040c1b);
    font: 1rem system-ui, sans-serif; }
  main { position: relative; z-index: 1; width: min(100%, 46rem); padding: 1rem .75rem; text-align: center; }
  h1 { margin: 0 0 .75rem; font: normal clamp(2.2rem, 7vw, 4rem) Georgia, serif; }
  .stage { display: grid; place-items: center; min-height: 17rem; perspective: 900px; }
  .stage > * { grid-area: 1 / 1; }
  .envelope { position: relative; width: min(76vw, 19rem); aspect-ratio: 1.55;
    border-radius: .35rem; background: #681823; box-shadow: 0 1rem 3rem #0006;
    animation: envelope 2.6s both; }
  .paper { position: absolute; z-index: 1; inset: 8% 8% 6%; border-radius: .25rem;
    background: repeating-linear-gradient(#f6e8c8 0 1.05rem, #ddc69c 1.05rem 1.1rem);
    animation: letter 2.6s both; }
  .pocket { position: absolute; z-index: 2; inset: 0; border-radius: inherit;
    background: linear-gradient(145deg, #a12a3b, #711623);
    clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%); }
  .flap { position: absolute; z-index: 3; inset: 0 0 auto; height: 64%; transform-origin: top;
    background: #b83d4c; clip-path: polygon(0 0, 100% 0, 50% 96%);
    animation: flap 2.6s linear both; }
  .seal { position: absolute; z-index: 4; left: 50%; top: 56%; translate: -50% -50%;
    display: grid; place-items: center; width: 2.8rem; height: 2.8rem; border-radius: 50%;
    background: #d7a650; color: #3f2121; font-size: 1.5rem; animation: seal 1.1s both; }
  .card { margin: 0; width: min(100%, 48svh, 34rem); aspect-ratio: 1080 / 1870;
    outline: 1px solid #377ca5;
    border-radius: .75rem; background: #07162c;
    box-shadow: 0 1rem 3rem #0005; overflow: hidden; }
  .card:not([hidden]) { animation: reveal .55s cubic-bezier(.16, 1, .3, 1) both; }
  .card img { display: block; width: 100%; height: 100%; object-fit: contain; }
  #status { margin: .8rem 0 0; color: #f7e4bd; }
  #status:empty { margin: 0; }
  .snow { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .flake { position: absolute; top: -2rem; left: var(--left); color: #fff;
    opacity: var(--opacity); font-size: var(--size);
    animation: snow var(--duration) var(--delay) linear infinite; }
  @keyframes snow { to { transform: translate(var(--drift), calc(100dvh + 4rem)) rotate(280deg); } }
  @keyframes envelope { 0% { opacity: 0; transform: translateY(1rem) scale(.9); }
    13%, 87% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(1rem) scale(.97); } }
  @keyframes flap {
    0%, 30% { transform: rotateX(0); z-index: 3; }
    /* Move the flap behind the letter while its edge faces the viewer. */
    46% { transform: rotateX(90deg); z-index: 3; }
    46.01% { transform: rotateX(90deg); z-index: 0; }
    62%, 100% { transform: rotateX(180deg); z-index: 0; }
  }
  @keyframes letter { 0%, 66% { transform: none; } 93%, 100% { transform: translateY(-68%); } }
  @keyframes seal { 0%, 55% { opacity: 1; } 100% { opacity: 0; transform: scale(.55); } }
  @keyframes reveal { from { opacity: 0; transform: translateY(1rem) scale(.96); } to { opacity: 1; transform: none; } }
</style>

<main>
  <h1>Коледно късметче</h1>
  <div class="stage">
    <div id="envelope" class="envelope" hidden aria-hidden="true">
      <div class="paper"></div><div class="pocket"></div><div class="flap"></div><div class="seal">✦</div>
    </div>
    <figure id="card" class="card" hidden aria-live="polite">
      <img id="picture" width="1080" height="1870" alt="">
    </figure>
  </div>
  <p id="status" role="status"></p>
  <noscript>Отворете файла в браузър с включен JavaScript, за да се разкрие късметчето.</noscript>
</main>
<script>
"use strict";

// Set this to 25 after adding images/02.jpg through images/25.jpg.
const imageCount = 25;
const storageKey = "qr-picture-deck-v1:" + imageCount;
const envelope = document.querySelector("#envelope");
const card = document.querySelector("#card");
const picture = document.querySelector("#picture");
const status = document.querySelector("#status");
let state = { remaining: [], last: null };

function drawNumber() {
  if (imageCount === 1) return 1;

  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    if (saved && Array.isArray(saved.remaining)) state = saved;
  } catch {
    // Some private browsers disallow local storage.
  }

  if (state.remaining.length === 0) {
    state.remaining = Array.from({ length: imageCount }, (_, i) => i + 1);
    for (let i = imageCount - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [state.remaining[i], state.remaining[j]] = [state.remaining[j], state.remaining[i]];
    }
    const lastIndex = imageCount - 1;
    if (state.remaining[lastIndex] === state.last) {
      [state.remaining[0], state.remaining[lastIndex]] =
        [state.remaining[lastIndex], state.remaining[0]];
    }
  }

  const number = state.remaining.pop();
  state.last = number;
  try {
    localStorage.setItem(storageKey, JSON.stringify(state));
  } catch {
    // The next page load can still draw a random fortune.
  }

  return number;
}

function loadPicture(number) {
  return new Promise(resolve => {
    const timeout = setTimeout(() => finish(false), 12000);
    function finish(loaded) {
      clearTimeout(timeout);
      picture.onload = null;
      picture.onerror = null;
      resolve(loaded);
    }
    picture.onload = () => finish(true);
    picture.onerror = () => finish(false);
    picture.alt = "Коледно късметче " + number;
    picture.src = "images/" + String(number).padStart(2, "0") + ".jpg";
  });
}

async function openFortune() {
  const number = drawNumber();
  card.hidden = true;
  envelope.hidden = false;
  status.textContent = "Късметчето се отваря…";

  const minimumDelay = new Promise(resolve => setTimeout(resolve, 2600));
  const [loaded] = await Promise.all([loadPicture(number), minimumDelay]);

  envelope.hidden = true;
  if (loaded) {
    card.hidden = false;
    status.textContent = "";
  } else {
    status.textContent = "Късметчето не се зареди. Зареди страницата отново.";
  }
}

openFortune();
</script>
