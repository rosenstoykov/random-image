<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Случайна картинка</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center;
    background: #11172a; color: #fff; font: 1rem system-ui, sans-serif; }
  main { width: min(100%, 65rem); padding: 1.25rem; text-align: center; }
  h1 { font-size: clamp(1.35rem, 5vw, 2rem); margin: 0 0 1rem; }
  img { display: block; max-width: 100%; max-height: 72svh; margin: auto; border-radius: .75rem; }
  .sample { display: grid; place-items: center; width: min(100%, 26rem);
    min-height: min(55svh, 24rem); margin: auto; border-radius: .75rem;
    background: hsl(var(--hue) 45% 32%); font-size: clamp(2.5rem, 12vw, 5rem); font-weight: bold; }
  [hidden] { display: none !important; }
  button { margin-top: 1rem; border: 0; border-radius: .6rem; padding: .75rem 1.2rem;
    background: #c9f576; color: #121b14; font: inherit; font-weight: 700; cursor: pointer; }
</style>
<script defer src="picker.js"></script>
</head>
<body>
<main>
  <h1>Случайна картинка</h1>
  <img id="picture" hidden alt="">
  <div id="sample" class="sample" hidden aria-hidden="true"></div>
  <p id="status" role="status"></p>
  <button type="button" id="next">Покажи друга</button>
  <noscript>Включете JavaScript, за да се покаже картинката.</noscript>
</main>
</body>
</html>
